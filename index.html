<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5b3df5;--primary2:#8b5cf6;--secondary:#00a884;--pink:#ec4899;--dark:#172033;--muted:#667085;--light:#f5f7ff;--white:#fff;--border:#e6e8f0;--danger:#d92d20;--success:#067647;--shadow:0 18px 60px rgba(31,41,55,.13)}
body{font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#fdf2f8,#ecfdf5);color:var(--dark);min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}.screen{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.97);border-radius:28px;box-shadow:var(--shadow);width:min(1080px,100%);padding:38px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:23px;color:var(--primary)}
.logo-icon{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--primary),var(--pink));display:grid;place-items:center;color:#fff;font-size:25px;flex:none}

.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;box-shadow:0 7px 18px rgba(91,61,245,.18)}
.secondary{background:#eef0ff;color:var(--primary);padding:14px 22px;border-radius:14px;font-weight:700}.danger{background:#fff0f0;color:var(--danger);padding:12px 18px;border-radius:12px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.form{max-width:500px;margin:25px auto 0}
label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;padding:14px 15px;border:2px solid var(--border);border-radius:13px;outline:none;background:#fff;transition:.2s}
input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(91,61,245,.08)}
.error,.success{padding:11px 13px;border-radius:10px;margin-top:12px;font-size:14px}.error{color:var(--danger);background:#fff1f0}.success{color:var(--success);background:#ecfdf3}
.center{text-align:center}.step-head{text-align:center;margin-bottom:28px}.progress{display:flex;gap:8px;justify-content:center;margin:18px 0 30px}.dot{width:42px;height:8px;border-radius:99px;background:#ddd}.dot.active{background:linear-gradient(90deg,var(--primary),var(--pink))}
.language-grid,.department-grid,.feature-grid,.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.choice{padding:20px;border:2px solid #e9eaf2;border-radius:18px;background:#fff;text-align:left;transition:.2s}.choice:hover,.choice.selected{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 10px 25px rgba(91,61,245,.12)}.choice .emoji{font-size:30px;margin-bottom:9px}.choice strong{display:block;margin-bottom:5px}
.dashboard{min-height:100vh;padding:20px}.topbar{background:rgba(255,255,255,.97);border-radius:20px;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:0 8px 30px rgba(31,41,55,.08);position:sticky;top:12px;z-index:20}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:#eef0ff;color:var(--primary);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
.content{max-width:1250px;margin:28px auto}.hero{background:linear-gradient(135deg,#4f35df,#7c3aed 48%,#ec4899);color:#fff;border-radius:28px;padding:42px;display:grid;grid-template-columns:1.3fr .7fr;gap:30px;overflow:hidden}.hero p{color:#eee8ff}.hero h1{margin-top:0}.hero-art{display:grid;place-items:center;font-size:110px}
.section{margin-top:28px;background:rgba(255,255,255,.94);border-radius:25px;padding:28px;box-shadow:0 10px 35px rgba(31,41,55,.07)}
.service{border-radius:20px;padding:23px;color:#fff;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.jobs{background:linear-gradient(135deg,#ff7a18,#ffb347)}.health{background:linear-gradient(135deg,#00a884,#43d9b8)}.education{background:linear-gradient(135deg,#2563eb,#60a5fa)}.gov{background:linear-gradient(135deg,#7c3aed,#c084fc)}.service p{color:#fff;opacity:.92}.service button{align-self:flex-start;background:#fff;color:var(--dark);padding:10px 14px;border-radius:10px;font-weight:700}
.feature{background:#fff;border:1px solid #eceef5;padding:22px;border-radius:18px}.feature-icon{font-size:34px;margin-bottom:10px}
.voice-box{background:linear-gradient(135deg,#ecfdf5,#eef2ff);border:2px solid #dfe5ff;border-radius:22px;padding:25px}.voice-status{padding:14px;border-radius:13px;background:#fff;margin:14px 0;color:var(--muted)}.result{background:#fff;border-radius:16px;padding:18px;min-height:75px;border:1px solid #e7e8ef;margin-top:14px}
.assistant{display:grid;grid-template-columns:1fr 1fr;gap:15px}.assistant-card{padding:20px;border-radius:18px;background:#fff;border:1px solid #e8e9f1}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:24px;padding:28px;width:min(650px,100%);max-height:90vh;overflow:auto}.close{float:right;background:#f1f3f8;border-radius:50%;width:38px;height:38px}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:14px 18px;border-radius:13px;display:none;z-index:200;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.toast.show{display:block}
.footer{text-align:center;color:var(--muted);padding:30px}.security-note{margin-top:16px;padding:12px 14px;background:#f8f9fc;border-radius:12px;font-size:13px;color:var(--muted)}
.language-note{margin:12px 0;padding:10px 13px;border-radius:12px;background:#f8f9ff;color:var(--muted);font-size:13px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-art{font-size:75px}.card{padding:25px}.assistant{grid-template-columns:1fr}.topbar{position:static}.top-actions{justify-content:flex-end}}

</head>
<body>

<section id="page1" class="screen">
<div class="card" style="max-width:900px">
<div class="logo"><div class="logo-icon">♿</div><span data-i18n="brand"></span></div>
<div class="center"><h1 id="authHeading"></h1><p id="authSubheading"></p></div>

<div style="display:flex;justify-content:center;gap:8px;margin:25px 0">
<button class="secondary" id="signInTab" style="min-width:140px" data-i18n="signIn"></button>
<button class="secondary" id="signUpTab" style="min-width:140px" data-i18n="signUp"></button>
</div>

<div id="signInForm" class="form">
<label for="loginUser" data-i18n="usernameEmail"></label>
<input id="loginUser" type="text" autocomplete="username">
<label for="loginPin" data-i18n="pin"></label>
<div style="position:relative"><input id="loginPin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"><button type="button" id="showLoginPin" aria-label="Show PIN" style="position:absolute;right:8px;top:7px;background:#eef0ff;color:#5b3df5;padding:8px 10px;border-radius:9px">👁</button></div>
<div id="loginError" class="error hidden" role="alert"></div><div id="loginSuccess" class="success hidden" role="status"></div>
<button class="primary" style="width:100%;margin-top:18px" id="loginBtn" data-i18n="signInButton"></button>
<button class="secondary" style="width:100%;margin-top:10px" id="clearLogin" data-i18n="clear"></button>
<p class="small center" style="margin-top:14px"><span data-i18n="newUser"></span> <b data-i18n="clickSignUp"></b></p>
</div>

<div id="signUpForm" class="form hidden">
<label for="signupName" data-i18n="fullName"></label><input id="signupName" type="text" autocomplete="name">
<label for="signupUser" data-i18n="username"></label><input id="signupUser" type="text" autocomplete="username">
<label for="signupEmail" data-i18n="email"></label><input id="signupEmail" type="email" autocomplete="email" pattern="[A-Za-z][A-Za-z._-]*[0-9]{4}@gmail\.com" title="Use name + exactly 4 digits + @gmail.com, for example kaveri1234@gmail.com">
<label for="signupPin" data-i18n="createPin"></label>
<div style="position:relative"><input id="signupPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"><button type="button" id="showSignupPin" aria-label="Show PIN" style="position:absolute;right:8px;top:7px;background:#eef0ff;color:#5b3df5;padding:8px 10px;border-radius:9px">👁</button></div>
<label for="signupConfirm" data-i18n="confirmPin"></label><input id="signupConfirm" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
<div id="signupError" class="error hidden" role="alert"></div><div id="signupSuccess" class="success hidden" role="status"></div>
<button class="primary" style="width:100%;margin-top:18px" id="signupBtn" data-i18n="createAccount"></button>
<button class="secondary" style="width:100%;margin-top:10px" id="clearSignup" data-i18n="clear"></button>
</div>
<div class="security-note" data-i18n="storageNote"></div>
</div>
</section>

<section id="page2" class="screen hidden">
<div class="card">
<div class="step-head"><div class="logo" style="justify-content:center"><div class="logo-icon">🌐</div><span data-i18n="language"></span></div>
<h2 data-i18n="selectLanguage"></h2><p data-i18n="languageHelp"></p>
<div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div></div>
<div id="languageGrid" class="language-grid"></div>
<div class="language-note" data-i18n="languageNote"></div>
<div class="actions" style="justify-content:center"><button class="secondary" id="backLogin" data-i18n="back"></button><button class="primary" id="languageNext" data-i18n="continue"></button></div>
</div>
</section>

<section id="page3" class="screen hidden">
<div class="card">
<div class="step-head"><div class="logo" style="justify-content:center"><div class="logo-icon">🧭</div><span data-i18n="department"></span></div>
<h2 data-i18n="selectDepartment"></h2><p data-i18n="departmentHelp"></p>
<div class="progress"><span class="dot active"></span><span class="dot active"></span><span class="dot"></span></div></div>
<div id="departmentGrid" class="department-grid"></div>
<div class="actions" style="justify-content:center"><button class="secondary" id="backLanguage" data-i18n="back"></button><button class="primary" id="departmentNext" data-i18n="openWebsite"></button></div>
</div>
</section>

<section id="page4" class="dashboard hidden">
<div class="topbar">
<div class="logo"><div class="logo-icon">♿</div><span data-i18n="brand"></span></div>
<div class="top-actions"><span id="userPill" class="pill"></span><span id="languagePill" class="pill"></span>
<button class="secondary" id="changeLanguage" data-i18n="languageButton"></button><button class="danger" id="logout" data-i18n="logout"></button></div>
</div>
<main class="content">
<section class="hero"><div><h1 id="heroTitle"></h1><p id="heroText"></p><div class="actions">
<button class="primary" id="voiceStartHero" data-i18n="speakAssistant"></button><button class="secondary" id="readHero" data-i18n="readPage"></button></div></div><div class="hero-art">🌍🗣️</div></section>

<section class="section"><h2 data-i18n="essentialServices"></h2><p data-i18n="serviceHelp"></p>
<div class="service-grid" style="margin-top:18px">
<article class="service jobs"><div><h3 id="jobsTitle"></h3><p id="jobsText"></p></div><button data-open-dept="Jobs" data-i18n="open"></button></article>
<article class="service health"><div><h3 id="healthTitle"></h3><p id="healthText"></p></div><button data-open-dept="Healthcare" data-i18n="open"></button></article>
<article class="service education"><div><h3 id="educationTitle"></h3><p id="educationText"></p></div><button data-open-dept="Education" data-i18n="open"></button></article>
<article class="service gov"><div><h3 id="govTitle"></h3><p id="govText"></p></div><button data-open-dept="Government Services" data-i18n="open"></button></article>
</div></section>

<section class="section"><h2 data-i18n="featuresTitle"></h2><div class="feature-grid" style="margin-top:18px">
<div class="feature"><div class="feature-icon">🎙️</div><h3 id="featureVoiceTitle"></h3><p id="featureVoiceText"></p></div>
<div class="feature"><div class="feature-icon">🔊</div><h3 id="featureReadTitle"></h3><p id="featureReadText"></p></div>
<div class="feature"><div class="feature-icon">👁️</div><h3 id="featureShowTitle"></h3><p id="featureShowText"></p></div>
<div class="feature"><div class="feature-icon">🛡️</div><h3 id="featureSafetyTitle"></h3><p id="featureSafetyText"></p></div>
<div class="feature"><div class="feature-icon">🌐</div><h3 id="featureLanguageTitle"></h3><p id="featureLanguageText"></p></div>
<div class="feature"><div class="feature-icon">🤝</div><h3 id="featureHumanTitle"></h3><p id="featureHumanText"></p></div>
</div></section>

<section class="section" id="voiceSection"><h2 data-i18n="voiceAssistant"></h2><p data-i18n="voiceHelp"></p>
<div class="voice-box" style="margin-top:18px"><div class="actions">
<button class="primary" id="voiceBtn" data-i18n="speakNow"></button><button class="secondary" id="speakResultBtn" data-i18n="speakResult"></button><button class="danger" id="stopBtn" data-i18n="stop"></button>
</div><div id="voiceStatus" class="voice-status"></div><div id="voiceResult" class="result"></div></div></section>

<section class="section"><h2 data-i18n="assistantTools"></h2><div class="assistant" style="margin-top:18px">
<div class="assistant-card"><h3 data-i18n="googleAssistant"></h3><p data-i18n="googleHelp"></p><button class="primary" style="margin-top:14px" id="googleBtn" data-i18n="openGoogle"></button></div>
<div class="assistant-card"><h3 data-i18n="websiteVoice"></h3><p data-i18n="websiteVoiceHelp"></p><button class="secondary" style="margin-top:14px" id="showMeBtn" data-i18n="showMeStart"></button></div>
</div></section>

<section id="showMe" class="section hidden"><h2 data-i18n="showMeTitle"></h2><p data-i18n="showMeHelp"></p><div id="steps" style="margin-top:18px"></div>
<div class="actions"><button class="primary" id="nextStep"></button><button class="secondary" id="resetSteps" data-i18n="reset"></button></div></section>

<section class="section"><h2 data-i18n="safetyTitle"></h2><div class="feature-grid" style="margin-top:18px">
<div class="feature"><h3 id="verifyTitle"></h3><p id="verifyText"></p></div><div class="feature"><h3 id="otpTitle"></h3><p id="otpText"></p></div><div class="feature"><h3 id="helpTitle"></h3><p id="helpText"></p></div>
</div></section>
<div class="footer" data-i18n="footer"></div>
</main></section>

<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><button class="close" id="modalClose" aria-label="Close">✕</button><h2 id="modalTitle"></h2><p id="modalText" style="margin-top:10px"></p>
<div class="actions"><button class="primary" id="modalSpeak" data-i18n="speakInformation"></button><button class="secondary" id="modalVoice" data-i18n="askVoice"></button></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

for(const code of languages.map(x=>x[0])){

let currentLanguage='en-IN',currentDepartment='Jobs',recognition=null,speaking=false,demoStep=0;
const $=id=>document.getElementById(id);
const langName=()=>languages.find(x=>x[0]===currentLanguage)?.[2]||'English';
const tr=key=>(T[currentLanguage]&&T[currentLanguage][key]!==undefined)?T[currentLanguage][key]:EN[key];
function safeJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
function savePreferences(){localStorage.setItem(STORAGE.preferences,JSON.stringify({language:currentLanguage,department:currentDepartment}))}
function getAccounts(){const a=safeJSON(STORAGE.accounts,[]);return Array.isArray(a)?a:[]}
function saveAccounts(a){localStorage.setItem(STORAGE.accounts,JSON.stringify(a))}
function getSession(){const s=safeJSON(STORAGE.session,null);return s&&s.loggedIn?s:null}
function saveSession(a){localStorage.setItem(STORAGE.session,JSON.stringify({username:a.username,email:a.email,name:a.name,loggedIn:true,loginAt:new Date().toISOString()}))}
function clearSession(){localStorage.removeItem(STORAGE.session)}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function showPage(id){['page1','page2','page3','page4'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),3500)}
function showAuthError(id,msg){$(id).textContent=msg;$(id).classList.remove('hidden')}
function hideAuthMessages(){['loginError','loginSuccess','signupError','signupSuccess'].forEach(id=>$(id).classList.add('hidden'))}
function validName(n){return /^[A-Za-zÀ-ÿ\u0080-\uFFFF][A-Za-zÀ-ÿ\u0080-\uFFFF .'-]{2,49}$/.test(n)}
function validUsername(u){return /^[A-Za-z0-9_]{3,20}$/.test(u)}
function validEmail(e){return /^[A-Za-z][A-Za-z._-]*\d{4}@gmail\.com$/.test(e)}
function validPin(p){return /^\d{4}$/.test(p)&&!/^(\d)\1{3}$/.test(p)&&!['1234','4321','0123','9876','1111','2222','3333','4444','5555','6666','7777','8888','9999','0000'].includes(p)}
async function hashPin(pin){const data=new TextEncoder().encode(pin);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function verifyPin(account,pin){if(account.pinHash)return account.pinHash===await hashPin(pin);return account.pin===pin}
function setAuthMode(mode){hideAuthMessages();const signIn=mode==='signin';$('signInForm').classList.toggle('hidden',!signIn);$('signUpForm').classList.toggle('hidden',signIn);$('authHeading').textContent=signIn?tr('welcome'):tr('createWelcome');$('authSubheading').textContent=signIn?tr('authSub'):tr('createSub');$('signInTab').className=signIn?'primary':'secondary';$('signUpTab').className=!signIn?'primary':'secondary'}
function togglePin(id){const x=$(id);x.type=x.type==='password'?'text':'password'}
function speak(text){if(!text)return;if(!('speechSynthesis'in window)){toast(tr('speechUnsupported'));return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=currentLanguage;u.rate=.9;const voices=speechSynthesis.getVoices();const exact=voices.find(v=>(v.lang||'').toLowerCase()===currentLanguage.toLowerCase());const base=voices.find(v=>(v.lang||'').toLowerCase().startsWith(currentLanguage.split('-')[0].toLowerCase()));if(exact)u.voice=exact;else if(base)u.voice=base;u.onerror=()=>toast(tr('speechUnavailable'));speechSynthesis.speak(u)}
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel()}

function applyTranslations(){
 document.documentElement.lang=currentLanguage;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const v=tr(el.dataset.i18n);if(v!==undefined)el.textContent=v});
 $('authHeading').textContent=$('signUpForm').classList.contains('hidden')?tr('welcome'):tr('createWelcome');
 $('authSubheading').textContent=$('signUpForm').classList.contains('hidden')?tr('authSub'):tr('createSub');
 $('heroTitle').textContent=tr('heroTitle');$('heroText').textContent=tr('heroText');
 $('jobsTitle').textContent=tr('departmentNames').Jobs;$('healthTitle').textContent=tr('departmentNames').Healthcare;$('educationTitle').textContent=tr('departmentNames').Education;$('govTitle').textContent=tr('departmentNames')['Government Services'];
 $('jobsText').textContent=tr('info').Jobs;$('healthText').textContent=tr('info').Healthcare;$('educationText').textContent=tr('info').Education;$('govText').textContent=tr('info')['Government Services'];
 [['featureVoiceTitle','voiceTitle'],['featureVoiceText','voiceText'],['featureReadTitle','readTitle'],['featureReadText','readText'],['featureShowTitle','showTitle'],['featureShowText','showText'],['featureSafetyTitle','safetyFeatureTitle'],['featureSafetyText','safetyFeatureText'],['featureLanguageTitle','languageFeatureTitle'],['featureLanguageText','languageFeatureText'],['featureHumanTitle','humanTitle'],['featureHumanText','humanText'],['verifyTitle','verifyTitle'],['verifyText','verifyText'],['otpTitle','otpTitle'],['otpText','otpText'],['helpTitle','helpTitle'],['helpText','helpText']].forEach(([id,k])=>$(id).textContent=tr(k));
 $('voiceStatus').textContent=tr('ready');$('voiceResult').textContent=tr('resultPlaceholder');
 const placeholders={loginUser:currentLanguage==='kn-IN'?'ಬಳಕೆದಾರ ಹೆಸರು ಅಥವಾ ಇಮೇಲ್ ನಮೂದಿಸಿ':currentLanguage==='hi-IN'?'यूज़रनेम या ईमेल दर्ज करें':currentLanguage==='te-IN'?'వినియోగదారు పేరు లేదా ఇమెయిల్ నమోదు చేయండి':currentLanguage==='ta-IN'?'பயனர் பெயர் அல்லது மின்னஞ்சலை உள்ளிடவும்':'Enter username or email',loginPin:'Enter your 4-digit PIN',signupName:'Enter your full name',signupUser:'3–20 letters, numbers or underscore',signupEmail:'Example: kaveri1234@gmail.com',signupPin:'Create a secure 4-digit PIN',signupConfirm:'Enter PIN again'};
 Object.keys(placeholders).forEach(id=>$(id).placeholder=placeholders[id]);
 $('languagePill').textContent='🌐 '+langName();const s=getSession();if(s)$('userPill').textContent='👤 '+s.name;
 buildLanguages();buildDepartments();renderDemo();
}
function buildLanguages(){
 $('languageGrid').innerHTML=languages.map(l=>`<button type="button" class="choice ${l[0]===currentLanguage?'selected':''}" data-lang="${l[0]}" aria-pressed="${l[0]===currentLanguage}"><div class="emoji">${l[1]}</div><strong>${escapeHTML(l[2])}</strong><span class="small">${l[0]}</span></button>`).join('');
 document.querySelectorAll('[data-lang]').forEach(btn=>btn.onclick=()=>{currentLanguage=btn.dataset.lang;savePreferences();applyTranslations();toast(tr('languageChanged').replace('{language}',langName()));speak(tr('languageChanged').replace('{language}',langName()))});

function buildDepartments(){
 $('departmentGrid').innerHTML=departments.map(d=>`<button type="button" class="choice ${d[0]===currentDepartment?'selected':''}" data-dept-choice="${escapeHTML(d[0])}"><div class="emoji">${d[1]}</div><strong>${escapeHTML(tr('departmentNames')[d[0]])}</strong><span class="small">${escapeHTML(tr('info')[d[0]].split(':')[0])}</span></button>`).join('');
 document.querySelectorAll('[data-dept-choice]').forEach(btn=>btn.onclick=()=>{currentDepartment=btn.dataset.deptChoice;savePreferences();buildDepartments()});
}
function getInfo(dept){return tr('info')[dept]||EN.info[dept]}
function openDepartment(dept){currentDepartment=dept;savePreferences();$('modalTitle').textContent=tr('departmentNames')[dept];$('modalText').textContent=getInfo(dept);$('modalBackdrop').classList.add('show');$('modalSpeak').onclick=()=>speak(getInfo(dept));$('modalVoice').onclick=()=>startVoice()}
function openDashboard(){const s=getSession();if(!s){setAuthMode('signin');showPage('page1');return}$('userPill').textContent='👤 '+s.name;$('languagePill').textContent='🌐 '+langName();applyTranslations();showPage('page4');openDepartment(currentDepartment)}

$('signupBtn').onclick=async()=>{
 hideAuthMessages();const name=$('signupName').value.trim(),username=$('signupUser').value.trim(),email=$('signupEmail').value.trim().toLowerCase(),pin=$('signupPin').value.trim(),confirm=$('signupConfirm').value.trim();
 if(!validName(name))return showAuthError('signupError',tr('invalidName'));if(!validUsername(username))return showAuthError('signupError',tr('invalidUser'));if(!validEmail(email))return showAuthError('signupError',tr('invalidEmail'));if(!validPin(pin))return showAuthError('signupError',tr('invalidPin'));if(pin!==confirm)return showAuthError('signupError',tr('pinMismatch'));
 const accounts=getAccounts();if(accounts.some(a=>a.username.toLowerCase()===username.toLowerCase()))return showAuthError('signupError',tr('usernameExists'));if(accounts.some(a=>a.email.toLowerCase()===email))return showAuthError('signupError',tr('emailExists'));
 let pinHash='';try{pinHash=await hashPin(pin)}catch{return showAuthError('signupError','Secure PIN storage is unavailable in this browser. Please use a modern browser.')};
 accounts.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,username,email,pinHash,createdAt:new Date().toISOString()});saveAccounts(accounts);
 $('signupSuccess').textContent=tr('accountCreated');$('signupSuccess').classList.remove('hidden');$('loginUser').value=username;$('loginPin').value='';$('signupPin').value='';$('signupConfirm').value='';setTimeout(()=>setAuthMode('signin'),1200);
};

$('loginBtn').onclick=async()=>{
 hideAuthMessages();const user=$('loginUser').value.trim(),pin=$('loginPin').value.trim();if(!user)return showAuthError('loginError',tr('accountNotFound'));if(!/^\d{4}$/.test(pin))return showAuthError('loginError',tr('invalidPin'));
 const account=getAccounts().find(a=>a.username.toLowerCase()===user.toLowerCase()||a.email.toLowerCase()===user.toLowerCase());if(!account)return showAuthError('loginError',tr('accountNotFound'));
 if(!(await verifyPin(account,pin)))return showAuthError('loginError',tr('wrongPin'));
 if(!account.pinHash){account.pinHash=await hashPin(pin);delete account.pin;const all=getAccounts();const i=all.findIndex(a=>a.id===account.id);if(i>=0){all[i]=account;saveAccounts(all)}}
 saveSession(account);$('loginSuccess').textContent=tr('loginSuccess');$('loginSuccess').classList.remove('hidden');setTimeout(()=>showPage('page2'),650);
};
$('clearLogin').onclick=()=>{$('loginUser').value='';$('loginPin').value='';hideAuthMessages()};

$('backLogin').onclick=()=>{setAuthMode('signin');showPage('page1')};
$('languageNext').onclick=()=>{buildDepartments();showPage('page3')};
$('backLanguage').onclick=()=>showPage('page2');
$('departmentNext').onclick=()=>{if(!currentDepartment)return toast(tr('chooseDepartment'));openDashboard()};
$('changeLanguage').onclick=()=>{buildLanguages();showPage('page2')};
$('logout').onclick=()=>{stopSpeech();if(recognition)try{recognition.stop()}catch{}recognition=null;speaking=false;clearSession();$('modalBackdrop').classList.remove('show');setAuthMode('signin');showPage('page1');toast(tr('loggedOut'))};
document.querySelectorAll('[data-open-dept]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();openDepartment(btn.dataset.openDept)});
$('modalClose').onclick=()=>$('modalBackdrop').classList.remove('show');$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))$('modalBackdrop').classList.remove('show')};
$('voiceStartHero').onclick=()=>{$('voiceSection').scrollIntoView({behavior:'smooth'});setTimeout(startVoice,350)};$('voiceBtn').onclick=startVoice;
$('stopBtn').onclick=()=>{if(recognition)try{recognition.stop()}catch{}stopSpeech();speaking=false;$('voiceStatus').textContent=tr('ready')};
$('speakResultBtn').onclick=()=>{const v=$('voiceResult').textContent;speak(!v||v===tr('resultPlaceholder')?tr('noResult'):v)};
$('readHero').onclick=()=>speak(tr('heroTitle')+'. '+tr('heroText'));

function startVoice(){
 if(!('SpeechRecognition'in window)&&!('webkitSpeechRecognition'in window)){toast(tr('voiceUnsupported'));$('voiceStatus').textContent=tr('voiceUnsupported');return}
 if(speaking)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang=currentLanguage;recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;speaking=true;$('voiceStatus').textContent='🎙️ '+tr('listening');$('voiceResult').textContent=tr('listening');
 recognition.onresult=e=>{const text=(e.results?.[0]?.[0]?.transcript||'').trim();$('voiceResult').textContent=text||tr('noSpeech');if(text)processCommand(text)};
 recognition.onerror=e=>{const map={'not-allowed':tr('micDenied'),'no-speech':tr('noSpeech'),'audio-capture':tr('micMissing'),'network':tr('networkError')};$('voiceStatus').textContent=map[e.error]||tr('voiceError');toast(map[e.error]||tr('voiceError'))};
 recognition.onend=()=>{speaking=false;$('voiceStatus').textContent=tr('ready')};try{recognition.start()}catch{$('voiceStatus').textContent=tr('voiceError');speaking=false}
}
function processCommand(text){
 const c=text.toLowerCase();const has=(...w)=>w.some(x=>c.includes(x.toLowerCase())||text.includes(x));
 if(has('job','jobs','employment','ಉದ್ಯೋಗ','ಕೆಲಸ','नौकरी','रोजगार','ఉద్యోగం','வேலை','ജോലി','नोकरी','চাকরি','નોકરી','ਨੌਕਰੀ','ملازمت','চাকৰি','ଚାକିରି'))return openDepartment('Jobs');
 if(has('health','hospital','doctor','ಆರೋಗ್ಯ','ಆಸ್ಪತ್ರೆ','स्वास्थ्य','अस्पताल','ఆరోగ్యం','ఆసుపత్రి','மருத்துவம்','ആരോഗ്യം','ആശുപത്രി','आरोग्य','স্বাস্থ্য','આરોગ્ય','ਸਿਹਤ','صحت','ସ୍ୱାସ୍ଥ୍ୟ'))return openDepartment('Healthcare');
 if(has('education','study','scholarship','college','ಶಿಕ್ಷಣ','शिक्षा','छात्रवृत्ति','విద్య','கல்வி','വിദ്യാഭ്യാസം','শিক্ষা','શિક્ષણ','ਸਿੱਖਿਆ','تعلیم','ଶିକ୍ଷା'))return openDepartment('Education');
 if(has('government','scheme','certificate','ಸರ್ಕಾರ','योजना','सरकार','ప్రభుత్వం','పథకం','அரசு','സർക്കാർ','সরকার','સરકાર','ਸਰਕਾਰ','حکومت','চৰকাৰ','ସରକାର'))return openDepartment('Government Services');
 if(has('show me','demo','how to','ನನಗೆ ತೋರಿಸಿ','शो मी','షో మీ','ஷோ மீ','ഷോ മീ','শো মি','શો મી','ਸ਼ੋ ਮੀ','شو می','শ্ব’ মি','ଶୋ ମି'))return showDemo();
 $('voiceResult').textContent=tr('unknown');speak(tr('unknown'));
}
function getDemoTexts(){return [tr('step1'),tr('step2'),tr('step3'),tr('step4'),tr('step5')]}
function showDemo(){$('showMe').classList.remove('hidden');demoStep=0;renderDemo();$('showMe').scrollIntoView({behavior:'smooth'})}

$('showMeBtn').onclick=showDemo;$('nextStep').onclick=()=>{const a=getDemoTexts();if(demoStep<a.length-1){demoStep++;renderDemo();speak(a[demoStep])}else{toast(tr('demoDone'));speak(tr('demoDone'))}};$('resetSteps').onclick=()=>{demoStep=0;renderDemo()};
